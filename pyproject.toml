[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "validated-study-tracker"
version = "1.0.0"
description = "A clinical study tracker with an append-only audit trail and requirement-traced tests, inspired by GxP practice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Karthik Sengupta" }]
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    # Pinned: newer ruff releases add lint rules, and CI should only fail on code changes.
    "ruff~=0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_tracker = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds the traceability tool, which has its own tests.
pythonpath = ["scripts"]
addopts = "--strict-markers"
# A warning is a defect waiting to happen; fail the run on any.
filterwarnings = ["error"]

[tool.coverage.run]
# The application and the tooling that decides whether a release is valid.
source = ["study_tracker", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

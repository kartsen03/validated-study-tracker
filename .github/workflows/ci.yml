name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Run tests
        run: >
          pytest
          --junitxml=reports/junit.xml
          --cov --cov-report=term
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage-html

      # Runs even when tests failed, so the report shows which requirements are affected.
      # Fails if any requirement lacks a passing test, or if docs/traceability_matrix.md
      # no longer matches these results.
      - name: Trace requirements to tests
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        run: >
          python scripts/traceability.py
          --junit reports/junit.xml
          --check
          --report reports/test_execution_report.md
          --coverage reports/coverage.xml
          --commit ${{ github.sha }}
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python }}
          path: reports/
          if-no-files-found: error

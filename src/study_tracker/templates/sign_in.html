{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Who are you?</h1>
<p class="muted">Every change is recorded under your name. This demo identifies users without
  passwords; a validated system would authenticate them.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">User</label>
  <select id="username" name="username" required>
    <option value="">Choose…</option>
    {% for user in users %}
      <option value="{{ user.username }}">{{ user.display_name }} ({{ user.username }})</option>
    {% endfor %}
  </select>
  <button type="submit">Continue</button>
</form>
{% endblock %}
